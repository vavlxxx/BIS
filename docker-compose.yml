services:
  mysql:
    image: mysql:8.0
    container_name: bis_mysql
    restart: unless-stopped
    env_file:
      - "./.env.mysql"
    networks:
      - bisnet
    ports:
      - "3307:3306"
    volumes:
      - mysql_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s

  wordpress:
    image: wordpress:latest
    container_name: bis_wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DEBUG: 1
    ports:
      - "8000:80"
    env_file:
      - "./.env.wordpress"
    networks:
      - bisnet
    volumes:
      - ./wp-theme:/var/www/html/wp-content/themes/bis-theme
      - ./uploads:/var/www/html/wp-content/uploads/
    depends_on:
      mysql:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bis_phpmyadmin
    restart: unless-stopped
    networks:
      - bisnet
    ports:
      - "9999:80"
    env_file:
      - "./.env.pma"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_db_data:

networks:
  bisnet:
    driver: bridge
